name: Validate CRM
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run sync:cloud
      - run: npm ci
        working-directory: cloud-server
      - run: npx tsc --noEmit
        working-directory: cloud-server
      - run: npm run build
        working-directory: cloud-server
